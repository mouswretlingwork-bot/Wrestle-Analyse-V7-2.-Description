
name: Build Wrestle Analyse APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q WrestleAnalyse_Android_Project_V7_0.zip -d source

      - name: Build APK
        working-directory: source/WrestleAnalyseAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wrestle-Analyse-V7.0-APK
          path: source/WrestleAnalyseAndroid/app/build/outputs/apk/debug/app-debug.apk
